<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#14281a"/>
      <stop offset="60%" stop-color="#0a140e"/>
      <stop offset="100%" stop-color="#040805"/>
    </radialGradient>

    <!-- Outer Deep Shadow for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Royal Gold Gradients -->
    <linearGradient id="goldFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F1A5"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA7C11"/>
      <stop offset="75%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>

    <linearGradient id="goldInnerRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B38F27"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#6E5004"/>
    </linearGradient>

    <!-- Trunk & Branches Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5a13"/>
      <stop offset="35%" stop-color="#c59b27"/>
      <stop offset="65%" stop-color="#f5e09e"/>
      <stop offset="100%" stop-color="#7a4e0e"/>
    </linearGradient>

    <!-- Luxurious Leaf Gradients -->
    <linearGradient id="leafGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66bb3a"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#144a1e"/>
    </linearGradient>

    <linearGradient id="leafGradHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="50%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>

    <linearGradient id="leafGradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Pearl/Fruit Gradients -->
    <radialGradient id="pearlGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFF8DC"/>
      <stop offset="75%" stop-color="#EEDC82"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#60440a"/>
    </linearGradient>

    <!-- Reusable Leaf Components with organic curve -->
    <path id="leaf-sm" d="M0,0 C -5,-8 -8,-16 0,-24 C 8,-16 5,-8 0,0 Z" />
    <path id="leaf-md" d="M0,0 C -7,-12 -12,-24 0,-34 C 12,-24 7,-12 0,0 Z" />
    <path id="leaf-lg" d="M0,0 C -10,-16 -15,-32 0,-44 C 15,-32 10,-16 0,0 Z" />
  </defs>

  <!-- 1. Background Rounded Frame & Outer Glow -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <circle cx="256" cy="240" r="215" fill="#09180E" stroke="url(#goldFrameGrad)" stroke-width="4" filter="url(#dropShadow)" />
  
  <!-- Outer Beaded Pearl Ring -->
  <g fill="url(#pearlGrad)">
    <circle cx="256" cy="31" r="3.5" />
    <circle cx="363" cy="62" r="3.5" />
    <circle cx="447" cy="133" r="3.5" />
    <circle cx="481" cy="240" r="3.5" />
    <circle cx="447" cy="347" r="3.5" />
    <circle cx="363" cy="418" r="3.5" />
    <circle cx="256" cy="449" r="3.5" />
    <circle cx="149" cy="418" r="3.5" />
    <circle cx="65" cy="347" r="3.5" />
    <circle cx="31" cy="240" r="3.5" />
    <circle cx="65" cy="133" r="3.5" />
    <circle cx="149" cy="62" r="3.5" />
    <!-- Intermediate Pearls -->
    <circle cx="312" cy="43" r="2.5" />
    <circle cx="410" cy="94" r="2.5" />
    <circle cx="470" cy="184" r="2.5" />
    <circle cx="470" cy="296" r="2.5" />
    <circle cx="410" cy="386" r="2.5" />
    <circle cx="312" cy="437" r="2.5" />
    <circle cx="200" cy="437" r="2.5" />
    <circle cx="102" cy="386" r="2.5" />
    <circle cx="42" cy="296" r="2.5" />
    <circle cx="42" cy="184" r="2.5" />
    <circle cx="102" cy="94" r="2.5" />
    <circle cx="200" cy="43" r="2.5" />
  </g>

  <!-- Inner Metallic Gold Ring -->
  <circle cx="256" cy="240" r="202" fill="none" stroke="url(#goldInnerRim)" stroke-width="2" />
  <circle cx="256" cy="240" r="198" fill="none" stroke="#102214" stroke-width="3" opacity="0.8" />
  
  <!-- Internal Background Disc -->
  <circle cx="256" cy="240" r="195" fill="#0b1a10" opacity="0.95" />

  <!-- 2. The Roots (Grounded & Noble) -->
  <g fill="none" stroke="url(#trunkGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)">
    <path d="M256,335 C248,348 226,362 195,368" stroke-width="7" />
    <path d="M256,335 C264,348 286,362 317,368" stroke-width="7" />
    <path d="M256,338 C256,350 256,362 256,370" stroke-width="5" />
    <path d="M220,352 C206,358 190,364 175,368" stroke-width="4" />
    <path d="M292,352 C306,358 322,364 337,368" stroke-width="4" />
  </g>

  <!-- 3. Trunk and Main Structure -->
  <g fill="none" stroke="url(#trunkGrad)" stroke-linecap="round" filter="url(#dropShadow)">
    <!-- Main Trunk -->
    <path d="M245,340 C245,310 248,275 252,245 C254,220 256,195 256,175" stroke-width="16" />
    
    <!-- Primary Boughs (Left & Right) -->
    <path d="M252,230 C220,210 180,185 145,150" stroke-width="11" />
    <path d="M252,230 C284,210 324,185 359,150" stroke-width="11" />

    <!-- Secondary Upper Branches -->
    <path d="M254,195 C235,165 210,135 180,110" stroke-width="7" />
    <path d="M254,195 C273,165 298,135 328,110" stroke-width="7" />
    <path d="M256,175 C256,145 256,120 256,95" stroke-width="6" />

    <!-- Detailed Lateral Twigs (Left) -->
    <path d="M185,175 C155,165 125,155 105,130" stroke-width="4.5" />
    <path d="M145,150 C125,125 110,105 95,85" stroke-width="3.5" />
    <path d="M210,140 C185,120 165,100 145,80" stroke-width="3.5" />
    <path d="M170,195 C145,190 120,180 100,165" stroke-width="3.5" />

    <!-- Detailed Lateral Twigs (Right) -->
    <path d="M327,175 C357,165 387,155 407,130" stroke-width="4.5" />
    <path d="M367,150 C387,125 402,105 417,85" stroke-width="3.5" />
    <path d="M302,140 C327,120 347,100 367,80" stroke-width="3.5" />
    <path d="M342,195 C367,190 392,180 412,165" stroke-width="3.5" />

    <!-- Crown Twigs -->
    <path d="M256,120 C235,100 220,85 205,70" stroke-width="3.5" />
    <path d="M256,120 C277,100 292,85 307,70" stroke-width="3.5" />
  </g>

  <!-- 4. Lush Foliage Canopy -->
  <!-- Deep Background Cluster (Emerald Green) -->
  <g fill="url(#leafGradMain)" opacity="0.9" filter="url(#dropShadow)">
    <use href="#leaf-lg" transform="translate(256, 75) rotate(0)" />
    <use href="#leaf-lg" transform="translate(195, 95) rotate(-25)" />
    <use href="#leaf-lg" transform="translate(317, 95) rotate(25)" />
    <use href="#leaf-lg" transform="translate(135, 135) rotate(-45)" />
    <use href="#leaf-lg" transform="translate(377, 135) rotate(45)" />
    <use href="#leaf-lg" transform="translate(100, 185) rotate(-65)" />
    <use href="#leaf-lg" transform="translate(412, 185) rotate(65)" />
    <use href="#leaf-md" transform="translate(225, 65) rotate(-10)" />
    <use href="#leaf-md" transform="translate(287, 65) rotate(10)" />
    <use href="#leaf-md" transform="translate(160, 110) rotate(-35)" />
    <use href="#leaf-md" transform="translate(352, 110) rotate(35)" />
  </g>

  <!-- Mid-Ground Cluster (Vibrant Greens) -->
  <g fill="url(#leafGradHighlight)" filter="url(#dropShadow)">
    <use href="#leaf-md" transform="translate(256, 60) rotate(0)" />
    <use href="#leaf-md" transform="translate(210, 80) rotate(-20)" />
    <use href="#leaf-md" transform="translate(302, 80) rotate(20)" />
    <use href="#leaf-md" transform="translate(150, 115) rotate(-40)" />
    <use href="#leaf-md" transform="translate(362, 115) rotate(40)" />
    <use href="#leaf-md" transform="translate(115, 160) rotate(-60)" />
    <use href="#leaf-md" transform="translate(397, 160) rotate(60)" />
    <use href="#leaf-md" transform="translate(90, 215) rotate(-75)" />
    <use href="#leaf-md" transform="translate(422, 215) rotate(75)" />

    <use href="#leaf-sm" transform="translate(235, 70) rotate(-15)" />
    <use href="#leaf-sm" transform="translate(277, 70) rotate(15)" />
    <use href="#leaf-sm" transform="translate(180, 100) rotate(-30)" />
    <use href="#leaf-sm" transform="translate(332, 100) rotate(30)" />
    <use href="#leaf-sm" transform="translate(130, 140) rotate(-50)" />
    <use href="#leaf-sm" transform="translate(382, 140) rotate(50)" />
    <use href="#leaf-sm" transform="translate(105, 195) rotate(-70)" />
    <use href="#leaf-sm" transform="translate(407, 195) rotate(70)" />
    
    <!-- Filling Lower Canopy -->
    <use href="#leaf-md" transform="translate(170, 220) rotate(-55)" />
    <use href="#leaf-md" transform="translate(342, 220) rotate(55)" />
    <use href="#leaf-sm" transform="translate(190, 245) rotate(-45)" />
    <use href="#leaf-sm" transform="translate(322, 245) rotate(45)" />
  </g>

  <!-- Foreground Highlights & Royal Gold Leaves -->
  <g fill="url(#leafGradGold)" filter="url(#dropShadow)">
    <use href="#leaf-sm" transform="translate(256, 50) rotate(0)" />
    <use href="#leaf-sm" transform="translate(165, 85) rotate(-35)" />
    <use href="#leaf-sm" transform="translate(347, 85) rotate(35)" />
    <use href="#leaf-sm" transform="translate(110, 130) rotate(-60)" />
    <use href="#leaf-sm" transform="translate(402, 130) rotate(60)" />
    <use href="#leaf-sm" transform="translate(220, 110) rotate(-10)" />
    <use href="#leaf-sm" transform="translate(292, 110) rotate(10)" />
  </g>

  <!-- 5. Golden Pearls & Fruits (Blessed Generations) -->
  <g fill="url(#pearlGrad)" filter="url(#dropShadow)">
    <circle cx="256" cy="95" r="4.5" />
    <circle cx="225" cy="115" r="4" />
    <circle cx="287" cy="115" r="4" />
    <circle cx="180" cy="130" r="4" />
    <circle cx="332" cy="130" r="4" />
    <circle cx="145" cy="165" r="4.5" />
    <circle cx="367" cy="165" r="4.5" />
    <circle cx="115" cy="205" r="4" />
    <circle cx="397" cy="205" r="4" />
    <circle cx="210" cy="170" r="4" />
    <circle cx="302" cy="170" r="4" />
    <circle cx="256" cy="150" r="4.5" />
    <circle cx="160" cy="210" r="3.5" />
    <circle cx="352" cy="210" r="3.5" />
  </g>

  <!-- 6. Royal Ribbon & Memorial Banner at the Bottom -->
  <g filter="url(#dropShadow)">
    <!-- Ribbon Back Folds -->
    <path d="M125,380 L95,420 L135,412 L160,380 Z" fill="#60440a" />
    <path d="M387,380 L417,420 L377,412 L352,380 Z" fill="#60440a" />

    <!-- Main Curved Ribbon Body -->
    <path d="M 115,365 Q 256,408 397,365 Q 402,425 256,438 Q 110,425 115,365 Z" 
          fill="url(#ribbonGrad)" stroke="#FFE875" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Ribbon End Fold Highlights -->
    <path d="M115,365 L95,395 L130,400 Z" fill="#D4AF37" opacity="0.8" />
    <path d="M397,365 L417,395 L382,400 Z" fill="#D4AF37" opacity="0.8" />

    <!-- Arabic Calligraphy Text: آل خميس -->
    <text x="256" y="407" 
          font-family="'Amiri', 'Traditional Arabic', serif" 
          font-size="34" 
          font-weight="bold" 
          fill="#3d2605" 
          text-anchor="middle" 
          dominant-baseline="central"
          direction="rtl">آل خميس</text>
          
    <text x="256" y="405" 
          font-family="'Amiri', 'Traditional Arabic', serif" 
          font-size="34" 
          font-weight="bold" 
          fill="#FFFBE8" 
          text-anchor="middle" 
          dominant-baseline="central"
          direction="rtl"
          filter="url(#textGlow)">آل خميس</text>
  </g>

  <!-- Top Crown Ornament -->
  <g transform="translate(256, 42)" filter="url(#dropShadow)">
    <path d="M 0,-12 L 5,-4 L 14,-4 L 7,2 L 9,11 L 0,6 L -9,11 L -7,2 L -14,-4 L -5,-4 Z" fill="url(#goldFrameGrad)"/>
    <circle cx="0" cy="-16" r="2.5" fill="#FFFFFF"/>
  </g>

</svg>
